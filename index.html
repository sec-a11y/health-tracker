<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ลงทะเบียน SIW Health Care Challenge#5</title>
    <!-- เรียกใช้ LINE LIFF SDK -->
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        body { font-family: 'Sarabun', sans-serif; padding: 20px; background-color: #f4f7f6; }
        .container { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h2 { color: #00b900; text-align: center; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"], input[type="number"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background-color: #00b900; color: white; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; font-weight: bold; }
        button:disabled { background-color: #cccccc; }
    </style>
</head>
<body>

<div class="container">
    <h2>📝 ลงทะเบียนเข้าร่วมกิจกรรม</h2>
    <form id="registerForm">
        <!-- ข้อมูลพนักงาน -->
        <div class="form-group"><label>รหัสพนักงาน</label><input type="text" id="empId" required></div>
        <div class="form-group"><label>ชื่อ-นามสกุล</label><input type="text" id="name" required></div>
        <div class="form-group"><label>แผนก</label><input type="text" id="dept" required></div>
        <div class="form-group"><label>โรคประจำตัว (ถ้าไม่มีให้ขีด -)</label><input type="text" id="condition" required></div>
        
        <hr>
        <h3 style="color:#333;">📊 ข้อมูลสุขภาพเริ่มต้น</h3>
        
        <div class="form-group"><label>ส่วนสูง (ซม.)</label><input type="number" step="0.1" id="height" required></div>
        <div class="form-group"><label>น้ำหนัก (กก.)</label><input type="number" step="0.1" id="weight" required></div>
        <div class="form-group"><label>BMI</label><input type="number" step="0.1" id="bmi" required></div>
        <div class="form-group"><label>รอบเอว (นิ้ว)</label><input type="number" step="0.1" id="waist" required></div>
        <div class="form-group"><label>%ไขมันใต้ชั้นผิวหนัง</label><input type="number" step="0.1" id="fatSub"></div>
        <div class="form-group"><label>ระดับไขมันช่องท้อง</label><input type="number" step="0.1" id="fatVisceral"></div>
        <div class="form-group"><label>%กล้ามเนื้อโครงร่าง</label><input type="number" step="0.1" id="muscle"></div>
        <div class="form-group"><label>อายุร่างกาย (ปี)</label><input type="number" id="bodyAge"></div>
        <div class="form-group"><label>อัตราการเผาผลาญขณะพัก (BMR)</label><input type="number" id="bmr"></div>
        
        <button type="submit" id="submitBtn">บันทึกข้อมูล</button>
    </form>
</div>

<script>
    // 1. นำ Web App URL ของ Google Apps Script มาใส่ที่นี่ (ที่ขึ้นต้นด้วย https://script.google.com/...)
    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzhfaDAwqr2vKHbVdJjZHwqH8eKyGdgXwCLdVkZ7qSOwIdm2ExJf-bfETZdtpN2jHEx/exec'; 
    
    // 2. นำ LIFF ID ที่ได้จาก LINE Developers มาใส่ที่นี่
    const LIFF_ID = '2011383737-Wc8xUNnu'; 

    let userLineUid = '';

    // เริ่มต้นทำงานเมื่อหน้าเว็บโหลด
    async function initializeLiff() {
        try {
            await liff.init({ liffId: LIFF_ID });
            if (liff.isLoggedIn()) {
                const profile = await liff.getProfile();
                userLineUid = profile.userId; // เก็บ UID ของพนักงาน
            } else {
                liff.login(); // ถ้ายังไม่ล็อกอิน ให้ล็อกอิน
            }
        } catch (error) {
            console.error('LIFF Init Error', error);
            alert('เกิดข้อผิดพลาดในการเชื่อมต่อ LINE');
        }
    }
    
    initializeLiff();

    // จัดการเมื่อกดปุ่มบันทึกข้อมูล
    document.getElementById('registerForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        if (!userLineUid) {
            alert('ไม่พบข้อมูลบัญชี LINE กรุณาลองใหม่อีกครั้ง');
            return;
        }

        const submitBtn = document.getElementById('submitBtn');
        submitBtn.disabled = true;
        submitBtn.innerText = 'กำลังบันทึกข้อมูล...';

        // รวบรวมข้อมูลจากฟอร์ม
        const formData = {
            action: 'register',
            lineUid: userLineUid,
            empId: document.getElementById('empId').value,
            name: document.getElementById('name').value,
            dept: document.getElementById('dept').value,
            condition: document.getElementById('condition').value,
            height: document.getElementById('height').value,
            weight: document.getElementById('weight').value,
            bmi: document.getElementById('bmi').value,
            waist: document.getElementById('waist').value,
            fatSub: document.getElementById('fatSub').value,
            fatVisceral: document.getElementById('fatVisceral').value,
            muscle: document.getElementById('muscle').value,
            bodyAge: document.getElementById('bodyAge').value,
            bmr: document.getElementById('bmr').value
        };

        // ส่งข้อมูลไปที่ Google Apps Script
        fetch(APPS_SCRIPT_URL, {
            method: 'POST',
            body: JSON.stringify(formData)
        })
        .then(response => response.json())
        .then(data => {
            if(data.status === 'success') {
                alert('ลงทะเบียนสำเร็จ!');
                liff.closeWindow(); // ปิดหน้าต่าง LIFF กลับไปที่แชท
            } else {
                alert('เกิดข้อผิดพลาด: ' + data.message);
                submitBtn.disabled = false;
                submitBtn.innerText = 'บันทึกข้อมูล';
            }
        })
        .catch(error => {
            console.error('Error:', error);
            alert('เกิดข้อผิดพลาดในการส่งข้อมูล');
            submitBtn.disabled = false;
            submitBtn.innerText = 'บันทึกข้อมูล';
        });
    });
</script>

</body>
</html>
