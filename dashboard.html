<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>แดชบอร์ดคะแนนสุขภาพ - SIW Health Care</title>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <!-- นำเข้าไลบรารี Chart.js สำหรับวาดกราฟ -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; background: #f0fdf4; padding: 15px; color: #1e293b; margin: 0; }
        .container { max-width: 480px; margin: auto; }
        .header { text-align: center; background: linear-gradient(135deg, #00b900, #047857); color: white; padding: 25px 20px; border-radius: 20px; box-shadow: 0 10px 20px rgba(0,185,0,0.15); margin-bottom: 20px; }
        .header h2 { margin: 0 0 5px 0; font-size: 22px; }
        .header p { margin: 0; opacity: 0.9; font-size: 14px; }
        
        /* การ์ดสรุปคะแนนส่วนตัว */
        .my-card { background: white; padding: 20px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 20px; border-left: 6px solid #00b900; }
        .my-card h3 { margin-top: 0; color: #047857; font-size: 18px; border-bottom: 1px solid #f1f5f9; padding-bottom: 8px; }
        .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 15px; }
        .stat-box { background: #f8fafc; padding: 12px; border-radius: 12px; text-align: center; }
        .stat-box .num { font-size: 24px; font-weight: bold; color: #059669; }
        .stat-box .label { font-size: 13px; color: #64748b; margin-top: 2px; }

        /* การ์ดกราฟสถิติส่วนตัว */
        .chart-card { background: white; padding: 20px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 20px; }
        .chart-card h3 { margin-top: 0; color: #1e293b; font-size: 18px; margin-bottom: 15px; }

        /* ตารางจัดอันดับ Leaderboard */
        .leaderboard-section { background: white; padding: 20px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .leaderboard-section h3 { margin-top: 0; color: #1e293b; font-size: 18px; margin-bottom: 15px; display: flex; align-items: center; gap: 8px; }
        
        .rank-item { display: flex; align-items: center; justify-content: space-between; padding: 12px 10px; border-bottom: 1px solid #f1f5f9; }
        .rank-item:last-child { border-bottom: none; }
        .user-info { display: flex; align-items: center; gap: 12px; }
        .rank-badge { width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 14px; background: #e2e8f0; color: #475569; }
        
        .rank-1 { background: #fef08a; color: #854d0e; }
        .rank-2 { background: #e2e8f0; color: #334155; }
        .rank-3 { background: #ffedd5; color: #9a3412; }
        
        .name { font-weight: 600; font-size: 15px; color: #334155; }
        .dept { font-size: 12px; color: #94a3b8; }
        .points { font-weight: bold; color: #059669; font-size: 16px; background: #ecfdf5; padding: 4px 12px; border-radius: 20px; }

        .loading { text-align: center; padding: 30px; color: #64748b; font-size: 16px; }
        .nav-btn { display: block; text-align: center; background: #f1f5f9; color: #334155; padding: 12px; border-radius: 12px; text-decoration: none; font-weight: 600; margin-top: 20px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>🏆 SIW Health Care Challenge</h2>
        <p>ตารางคะแนนและสถิติก้าวเดินสะสม</p>
    </div>

    <!-- ส่วนแสดงคะแนนของฉัน -->
    <div class="my-card">
        <h3>👤 คะแนนและสถิติส่วนตัวของคุณ</h3>
        <div id="myStats" class="loading">กำลังโหลดข้อมูลของคุณ...</div>
    </div>

    <!-- ส่วนแสดงกราฟก้าวเดินรายวัน -->
    <div class="chart-card">
        <h3>📈 กราฟสถิติก้าวเดินรายวันของคุณ</h3>
        <div style="position: relative; height: 220px; width: 100%;">
            <canvas id="myStepChart"></canvas>
        </div>
    </div>

    <!-- ส่วนตารางจัดอันดับ -->
    <div class="leaderboard-section">
        <h3>🏅 อันดับผู้เข้าร่วมกิจกรรม (Leaderboard)</h3>
        <div id="leaderboardList" class="loading">กำลังโหลดอันดับ...</div>
    </div>

    <a href="steps.html" class="nav-btn">⬅️ กลับไปหน้าบันทึกก้าวเดิน</a>
</div>

<script>
    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzhfaDAwqr2vKHbVdJjZHwqH8eKyGdgXwCLdVkZ7qSOwIdm2ExJf-bfETZdtpN2jHEx/exec'; 
    const LIFF_ID = '2011383737-sdvHMJPx'; // ใช้ LIFF ID ของหน้าแดชบอร์ด

    async function initDashboard() {
        try {
            await liff.init({ liffId: LIFF_ID });
            if (!liff.isLoggedIn()) {
                liff.login();
                return;
            }
            const profile = await liff.getProfile();
            fetchDashboardData(profile.userId);
        } catch (error) {
            console.error(error);
            document.getElementById('myStats').innerHTML = 'กรุณาเปิดผ่านแอปพลิเคชัน LINE';
        }
    }

    function fetchDashboardData(lineUid) {
        fetch(APPS_SCRIPT_URL + '?action=get_leaderboard&uid=' + lineUid)
            .then(res => res.json())
            .then(data => {
                if (data.status === 'success') {
                    renderMyStats(data.myStats);
                    renderMyChart(data.myHistory); // วาดกราฟจากประวัติส่วนตัว
                    renderLeaderboard(data.leaderboard);
                } else {
                    document.getElementById('myStats').innerHTML = 'ไม่พบข้อมูลการลงทะเบียน';
                    document.getElementById('leaderboardList').innerHTML = 'ไม่สามารถโหลดข้อมูลได้';
                }
            })
            .catch(err => {
                document.getElementById('myStats').innerHTML = 'เกิดข้อผิดพลาดในการเชื่อมต่อ';
                document.getElementById('leaderboardList').innerHTML = 'เกิดข้อผิดพลาดในการเชื่อมต่อ';
            });
    }

    function renderMyStats(stats) {
        const myDiv = document.getElementById('myStats');
        if (!stats) {
            myDiv.innerHTML = '<p style="color:red; text-align:center; margin:5px 0;">คุณยังไม่ได้ลงทะเบียน กรุณาลงทะเบียนก่อนร่วมกิจกรรมครับ</p>';
            return;
        }
        
        // กำหนดค่าเริ่มต้นเป็น 0 ป้องกันกรณี undefined
        const pendingCount = stats.pendingDays !== undefined ? stats.pendingDays : 0;

        myDiv.innerHTML = `
            <div style="font-weight:600; font-size:16px; color:#1e293b; margin-bottom: 12px;">${stats.name} <span style="font-size:13px; color:#64748b;">(${stats.dept})</span></div>
            
            <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 15px;">
                <div class="stat-box" style="padding: 10px 4px;">
                    <div class="num" style="font-size: 20px;">${stats.totalPoints}</div>
                    <div class="label" style="font-size: 11px;">คะแนน (แต้ม)</div>
                </div>
                <div class="stat-box" style="padding: 10px 4px;">
                    <div class="num" style="font-size: 20px; color: #0284c7;">${stats.totalDays}</div>
                    <div class="label" style="font-size: 11px;">อนุมัติแล้ว (วัน)</div>
                </div>
                <div class="stat-box" style="padding: 10px 4px; background: #fff7ed;">
                    <!-- ป้องกันด้วย || 0 ตรงนี้ -->
                    <div class="num" style="font-size: 20px; color: #ea580c;">${pendingCount}</div>
                    <div class="label" style="font-size: 11px; color: #c2410c;">รออนุมัติ (วัน)</div>
                </div>
            </div>

            <div style="margin-top: 12px; background: #ecfdf5; padding: 12px; border-radius: 12px; text-align: center; border: 1px dashed #059669;">
                <div style="font-size: 20px; font-weight: bold; color: #047857;">👟 ${Number(stats.totalSteps).toLocaleString()} ก้าว</div>
                <div style="font-size: 13px; color: #065f46; margin-top: 2px;">จำนวนก้าวเดินสะสมทั้งหมด</div>
            </div>
        `;
    }

    // ฟังก์ชันวาดกราฟ Chart.js
    function renderMyChart(historyList) {
        const ctx = document.getElementById('myStepChart').getContext('2d');
        
        if (!historyList || historyList.length === 0) {
            ctx.font = "14px Sarabun";
            ctx.fillStyle = "#64748b";
            ctx.textAlign = "center";
            ctx.fillText("ยังไม่มีประวัติการส่งก้าวเดิน", ctx.canvas.width / 2, ctx.canvas.height / 2);
            return;
        }

        const labels = historyList.map(item => item.date);
        const dataSteps = historyList.map(item => item.steps);

        new Chart(ctx, {
            type: 'bar',
            data: {
                labels: labels,
                datasets: [{
                    label: 'จำนวนก้าว',
                    data: dataSteps,
                    backgroundColor: '#10b981',
                    borderRadius: 6,
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { display: false }
                },
                scales: {
                    y: {
                        beginAtZero: true,
                        grid: { color: '#f1f5f9' }
                    },
                    x: {
                        grid: { display: false }
                    }
                }
            }
        });
    }

    function renderLeaderboard(list) {
        const listDiv = document.getElementById('leaderboardList');
        if (!list || list.length === 0) {
            listDiv.innerHTML = '<p style="text-align:center; color:#64748b;">ยังไม่มีผู้ทำกิจกรรม</p>';
            return;
        }

        let html = '';
        list.forEach((item, index) => {
            let rankClass = '';
            if (index === 0) rankClass = 'rank-1';
            else if (index === 1) rankClass = 'rank-2';
            else if (index === 2) rankClass = 'rank-3';

            html += `
                <div class="rank-item">
                    <div class="user-info">
                        <div class="rank-badge ${rankClass}">${index + 1}</div>
                        <div>
                            <div class="name">${item.name}</div>
                            <div class="dept">${item.dept || 'พนักงาน'} • <span style="color:#059669; font-weight:600;">👟 ${Number(item.totalSteps).toLocaleString()} ก้าว</span></div>
                        </div>
                    </div>
                    <div class="points">${item.points} 🌟</div>
                </div>
            `;
        });
        listDiv.innerHTML = html;
    }

    initDashboard();
</script>

</body>
</html>
