<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>บันทึกก้าวเดินรายวัน</title>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; background: #e0f5e9; padding: 20px; color: #333; }
        .container { background: white; padding: 25px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,185,0,0.1); max-width: 400px; margin: auto; }
        .header { text-align: center; color: #00b900; margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; }
        input[type="date"], input[type="number"], input[type="file"] { width: 100%; padding: 12px; margin-bottom: 15px; border: 1.5px solid #e2e8f0; border-radius: 10px; box-sizing: border-box; font-family: 'Sarabun', sans-serif; }
        button { width: 100%; padding: 15px; background: #00b900; color: white; border: none; border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer; }
        button:disabled { background: #cbd5e1; cursor: not-allowed; }
        #preview { max-width: 100%; border-radius: 10px; display: none; margin-bottom: 15px; }
        .alert-box { background: #fee2e2; color: #991b1b; padding: 10px; border-radius: 8px; font-size: 14px; margin-bottom: 15px; display: none; text-align: center; font-weight: 600; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>👟 ส่งก้าวเดินประจำวัน</h2>
        <p>เป้าหมาย: 10,000 ก้าวขึ้นไป = 1 แต้ม</p>
    </div>

    <div id="duplicateAlert" class="alert-box">⚠️ คุณได้ส่งข้อมูลของวันนี้ไปแล้ว ไม่สามารถส่งซ้ำได้ค่ะ</div>

    <form id="stepForm">
        <label>เลือกวันที่เดิน</label>
        <input type="date" id="selectedDate" required>

        <label>จำนวนก้าวที่เดินได้ (ก้าว)</label>
        <input type="number" id="steps" min="10000" placeholder="ระบุจำนวนก้าว (ขั้นต่ำ 10,000)" required>

        <label>อัปโหลดรูปภาพ</label>
        <input type="file" id="imageFile" accept="image/*" required>
        <img id="preview" alt="ภาพพรีวิว">

        <button type="submit" id="submitBtn">ส่งข้อมูล</button>
    </form>
</div>

<script>
    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzhfaDAwqr2vKHbVdJjZHwqH8eKyGdgXwCLdVkZ7qSOwIdm2ExJf-bfETZdtpN2jHEx/exec'; 
    const LIFF_ID = '2011383737-hxvMTfCW'; 
    let userLineUid = '';
    let base64Image = '';
    let submittedDatesList = [];

    // ตั้งค่าเริ่มต้นวันที่ปัจจุบัน
    const today = new Date();
    const yyyy = today.getFullYear();
    const mm = String(today.getMonth() + 1).padStart(2, '0');
    const dd = String(today.getDate()).padStart(2, '0');
    const todayStr = `${yyyy}-${mm}-${dd}`;
    
    const dateInput = document.getElementById('selectedDate');
    dateInput.value = todayStr;

    async function initializeLiff() {
        try {
            await liff.init({ liffId: LIFF_ID });
            if (liff.isLoggedIn()) { 
                userLineUid = (await liff.getProfile()).userId;
                checkSubmittedDates(userLineUid); // ดึงข้อมูลวันที่เคยส่งแล้วมาเช็ก
            } else { 
                liff.login(); 
            }
        } catch (error) {
            console.error('LIFF Init Error:', error);
        }
    }
    initializeLiff();

    // ฟังก์ชันดึงประวัติวันที่เคยส่งแล้วจาก Google Sheet
    function checkSubmittedDates(uid) {
        fetch(`${APPS_SCRIPT_URL}?action=get_submitted_dates&uid=${uid}`)
            .then(res => res.json())
            .then(data => {
                if (data.status === 'success') {
                    submittedDatesList = data.submittedDates;
                    validateSelectedDate(); // ตรวจสอบวันที่เริ่มต้นทันที
                }
            })
            .catch(err => console.error('Error fetching dates:', err));
    }

    // ตรวจสอบว่าวันที่ผู้ใช้เลือก เคยส่งไปหรือยัง
    function validateSelectedDate() {
        const selectedVal = dateInput.value;
        const submitBtn = document.getElementById('submitBtn');
        const alertBox = document.getElementById('duplicateAlert');

        if (submittedDatesList.includes(selectedVal)) {
            alertBox.style.display = 'block';
            submitBtn.disabled = true;
            submitBtn.style.background = '#cbd5e1';
        } else {
            alertBox.style.display = 'none';
            submitBtn.disabled = false;
            submitBtn.style.background = '#00b900';
        }
    }

    // ดักจับเมื่อผู้ใช้เปลี่ยนวันที่ในปฏิทิน
    dateInput.addEventListener('change', validateSelectedDate);

    // แสดงภาพพรีวิวและย่อขนาดรูป
    document.getElementById('imageFile').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(event) {
            const img = new Image();
            img.onload = function() {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                const MAX_WIDTH = 800;
                const scaleSize = MAX_WIDTH / img.width;
                canvas.width = MAX_WIDTH;
                canvas.height = img.height * scaleSize;
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                
                base64Image = canvas.toDataURL('image/jpeg', 0.7).split(',')[1];
                
                const preview = document.getElementById('preview');
                preview.src = canvas.toDataURL('image/jpeg', 0.7);
                preview.style.display = 'block';
            }
            img.src = event.target.result;
        }
        reader.readAsDataURL(file);
    });

    // ส่งข้อมูล
    document.getElementById('stepForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        if (!userLineUid) {
            alert('กำลังดึงข้อมูลจาก LINE กรุณารอสักครู่');
            return;
        }

        const steps = document.getElementById('steps').value;
        if (steps < 10000) {
            alert('ต้องเดินให้ครบ 10,000 ก้าวขึ้นไปนะครับ สู้ๆ!');
            return;
        }

        const rawDate = dateInput.value;
        if (submittedDatesList.includes(rawDate)) {
            alert('วันที่คุณเลือกเคยถูกส่งข้อมูลไปแล้ว ไม่สามารถส่งซ้ำได้ค่ะ');
            return;
        }

        const submitBtn = document.getElementById('submitBtn');
        submitBtn.disabled = true;
        submitBtn.innerText = 'กำลังอัปโหลดรูปและส่งข้อมูล...';

        // แปลงวันที่เป็น DD/MM/YYYY สำหรับบันทึกลง Sheet
        const dateParts = rawDate.split('-');
        const dateStr = `${dateParts[2]}/${dateParts[1]}/${dateParts[0]}`;

        const formData = {
            action: 'log_steps',
            lineUid: userLineUid,
            date: dateStr,
            steps: steps,
            imageBase64: base64Image
        };

        fetch(APPS_SCRIPT_URL, {
            method: 'POST',
            body: JSON.stringify(formData)
        }).then(res => res.json()).then(data => {
            if(data.status === 'success') {
                alert('ส่งข้อมูลสำเร็จ! รอแอดมินตรวจสอบเพื่อรับแต้มค่ะ');
                liff.closeWindow();
            } else {
                alert(data.message);
                submitBtn.disabled = false;
                submitBtn.innerText = 'ส่งข้อมูล';
            }
        }).catch(err => {
            alert('เกิดข้อผิดพลาด กรุณาลองใหม่');
            submitBtn.disabled = false;
            submitBtn.innerText = 'ส่งข้อมูล';
        });
    });
</script>
</body>
</html>
