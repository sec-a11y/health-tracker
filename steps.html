<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>บันทึกก้าวเดินรายวัน</title>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; background: #e0f5e9; padding: 20px; color: #333; }
        .container { background: white; padding: 25px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,185,0,0.1); max-width: 400px; margin: auto; }
        .header { text-align: center; color: #00b900; margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; }
        input[type="number"], input[type="file"] { width: 100%; padding: 12px; margin-bottom: 15px; border: 1.5px solid #e2e8f0; border-radius: 10px; box-sizing: border-box; }
        button { width: 100%; padding: 15px; background: #00b900; color: white; border: none; border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer; }
        button:disabled { background: #ccc; }
        #preview { max-width: 100%; border-radius: 10px; display: none; margin-bottom: 15px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>👟 ส่งก้าวเดินประจำวัน</h2>
        <p>เป้าหมาย: 10,000 ก้าวขึ้นไป = 1 แต้ม</p>
    </div>

    <form id="stepForm">
        <label>วันที่ส่งข้อมูล</label>
        <input type="text" id="todayDate" disabled style="width: 100%; padding: 12px; margin-bottom: 15px; border: none; background: #f1f5f9; border-radius: 10px; text-align: center; font-weight: bold;">

        <label>จำนวนก้าวที่เดินได้ (ก้าว)</label>
        <input type="number" id="steps" min="10000" placeholder="ระบุจำนวนก้าว (ขั้นต่ำ 10,000)" required>

        <label>อัปโหลดรูปภาพหลักฐาน</label>
        <input type="file" id="imageFile" accept="image/*" required>
        <img id="preview" alt="ภาพพรีวิว">

        <button type="submit" id="submitBtn">ส่งข้อมูล</button>
    </form>
</div>

<script>
    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzhfaDAwqr2vKHbVdJjZHwqH8eKyGdgXwCLdVkZ7qSOwIdm2ExJf-bfETZdtpN2jHEx/exec'; 
    const LIFF_ID = 'ใส่_LIFF_ID_ของหน้านี้'; // ต้องสร้าง LIFF ใหม่สำหรับหน้านี้
    let userLineUid = '';
    let base64Image = '';

    // สร้างวันที่ปัจจุบัน
    const today = new Date();
    const dateStr = today.getDate().toString().padStart(2, '0') + '/' + (today.getMonth() + 1).toString().padStart(2, '0') + '/' + today.getFullYear();
    document.getElementById('todayDate').value = dateStr;

    async function initializeLiff() {
        await liff.init({ liffId: LIFF_ID });
        if (liff.isLoggedIn()) { userLineUid = (await liff.getProfile()).userId; }
        else { liff.login(); }
    }
    initializeLiff();

    // แสดงภาพพรีวิวและย่อขนาดรูป (Compress)
    document.getElementById('imageFile').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(event) {
            const img = new Image();
            img.onload = function() {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                const MAX_WIDTH = 800; // ย่อขนาดเพื่อไม่ให้หนักเกินไป
                const scaleSize = MAX_WIDTH / img.width;
                canvas.width = MAX_WIDTH;
                canvas.height = img.height * scaleSize;
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                
                // แปลงภาพเป็น Base64 แบบตัดส่วนหัวออก
                base64Image = canvas.toDataURL('image/jpeg', 0.7).split(',')[1];
                
                const preview = document.getElementById('preview');
                preview.src = canvas.toDataURL('image/jpeg', 0.7);
                preview.style.display = 'block';
            }
            img.src = event.target.result;
        }
        reader.readAsDataURL(file);
    });

    // ส่งข้อมูล
    document.getElementById('stepForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const steps = document.getElementById('steps').value;

        if (steps < 10000) {
            alert('ต้องเดินให้ครบ 10,000 ก้าวขึ้นไปนะครับ สู้ๆ!');
            return;
        }

        const submitBtn = document.getElementById('submitBtn');
        submitBtn.disabled = true;
        submitBtn.innerText = 'กำลังอัปโหลดรูปและส่งข้อมูล...';

        const formData = {
            action: 'log_steps',
            lineUid: userLineUid,
            date: dateStr,
            steps: steps,
            imageBase64: base64Image
        };

        fetch(APPS_SCRIPT_URL, {
            method: 'POST',
            body: JSON.stringify(formData)
        }).then(res => res.json()).then(data => {
            if(data.status === 'success') {
                alert('ส่งข้อมูลสำเร็จ! รอแอดมินตรวจสอบเพื่อรับแต้มครับ');
                liff.closeWindow();
            } else {
                alert(data.message);
                submitBtn.disabled = false;
                submitBtn.innerText = 'ส่งข้อมูล';
            }
        }).catch(err => {
            alert('เกิดข้อผิดพลาด กรุณาลองใหม่');
            submitBtn.disabled = false;
            submitBtn.innerText = 'ส่งข้อมูล';
        });
    });
</script>
</body>
</html>
